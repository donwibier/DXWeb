name: Publish DX.Data.Xpo.Mapster to nuget
on:
  workflow_dispatch: {}
#  push:
#    branches:
#      - master # Default release branch
jobs:
  build:
    name: build, pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.0.x' ]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6        
        with:
          # 10.0.x as well: the projects target net10.0 too, so don't rely on the image having it
          dotnet-version: |
            ${{ matrix.dotnet }}
            10.0.x

      - name: add dx nuget source
        run: dotnet nuget add source ${{secrets.DX_PRIVATE_NUGET}}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests 
        run: dotnet test --no-restore --verbosity normal

      - name: Pack 
        run: dotnet pack --configuration Release --no-restore --output ./nupkg

      - name: Publish to NuGet 
        uses: actions/upload-artifact@v7 
        with: 
          name: nupkg 
          path: ./nupkg/*.nupkg

      #- name: Publish the package to nuget.org
      #  run: dotnet nuget push */bin/Release/*.nupkg --skip-duplicate -k $NUGET_AUTH_TOKEN -s https://api.nuget.org/v3/index.json
      #  env:
      #    NUGET_AUTH_TOKEN: ${{secrets.NUGET_API_KEY}}

  deploy:
    runs-on: ubuntu-latest 
    needs: build 
      
    steps: 
      - name: Download package 
        uses: actions/download-artifact@v8 
        with: 
          name: nupkg 
          path: ./nupkg 
            
      - name: Publish to NuGet 
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json


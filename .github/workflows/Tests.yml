name: Tests
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch: {}
jobs:
  test:
    name: dotnet test (${{ matrix.os }})
    # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19: both until then
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-26.04 ]
    runs-on: ${{ matrix.os }}
    env:
      DX_FEED: ${{ secrets.DX_PRIVATE_NUGET }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: add dx nuget source
        if: env.DX_FEED != ''
        run: dotnet nuget add source "$DX_FEED"

      # the whole solution, as Publish NuGet Packages builds it
      - name: Build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: DX.Utils.CronJobs.Tests
        run: dotnet test DX.Utils.CronJobs.Tests --configuration Release --no-build --verbosity normal

      - name: DX.Data.Xpo.Identity.Tests
        run: dotnet test DX.Data.Xpo.Identity.Tests --configuration Release --no-build --verbosity normal
